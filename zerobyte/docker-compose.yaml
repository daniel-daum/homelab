services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.44.2@sha256:e100152258f0d167778e0623985a3ea0d1d98e5749d3e316911da8b13c48e3d2
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      - TZ
      - BASE_URL
      - APP_SECRET
    volumes:
      - /etc/localtime:/etc/localtime
      - /var/lib/zerobyte:/var/lib/zerobyte
      - /var/lib/docker/volumes:/backup/docker-volumes
