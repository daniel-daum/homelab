services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.43.2@sha256:bca46c0e78b8fb57cb6b8030c9be71178324290750501239b0121cdb43dfdf87
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      - TZ
      - BASE_URL
      - APP_SECRET
    volumes:
      - /etc/localtime:/etc/localtime
      - /var/lib/zerobyte:/var/lib/zerobyte
      - /var/lib/docker/volumes:/backup-sources/docker-volumes
