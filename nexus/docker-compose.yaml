services:
  nexus:
    image: sonatype/nexus3:3.97.1@sha256:ffed04698ded3565ca3b40f4abd063d59b63c2fbeb134170e095bc1197931cd5
    container_name: nexus
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"   # dockerhub proxy
      - "127.0.0.1:8083:8083"   # ghcr pr
    volumes:
      - nexus-data:/nexus-data
    networks:
      - holonet
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  nexus-data:
    name: nexus-data
    driver: local

networks:
  holonet:
    external: true
