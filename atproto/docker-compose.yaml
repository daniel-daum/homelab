services:
  atproto:
    image: ghcr.io/bluesky-social/pds:0.4.5037@sha256:3a8feb3415e319dbcc13372293b7ef1fb05a318a6ff1d55968cf99ba6633c5d4
    container_name: atproto
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dxun
    volumes:
      - atproto-data:/pds
    environment:
      - PDS_HOSTNAME
      - PDS_SERVICE_HANDLE_DOMAINS
      - PDS_JWT_SECRET
      - PDS_ADMIN_PASSWORD
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX
      - PDS_DATA_DIRECTORY
      - PDS_BLOBSTORE_DISK_LOCATION
      - PDS_BLOB_UPLOAD_LIMIT
      - PDS_DID_PLC_URL
      - PDS_BSKY_APP_VIEW_URL
      - PDS_BSKY_APP_VIEW_DID
      - PDS_REPORT_SERVICE_URL
      - PDS_REPORT_SERVICE_DID
      - PDS_CRAWLERS
      - LOG_ENABLED
      - PDS_RATE_LIMITS_ENABLED
      - PDS_INVITE_REQUIRED
      - PDS_EMAIL_FROM_ADDRESS
      - PDS_EMAIL_SMTP_URL
volumes:
  atproto-data:
    name: atproto-data
    driver: local

networks:
  dxun:
    external: true
