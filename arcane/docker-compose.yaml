services:
  arcane:
    image: ghcr.io/getarcaneapp/manager@sha256:e211067a6808c1598175141cd19c48eab874a24b5b649be3ddcb3894db7e73cd
    container_name: arcane
    restart: unless-stopped
    ports:
      - "127.0.0.1:3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - APP_URL
      - PUID
      - PGID
      - ENCRYPTION_KEY
      - LOG_LEVEL
      - OIDC_ENABLED
    networks:
      - holonet

volumes:
  arcane-data:
    name: arcane-data

networks:
  holonet:
    external: true
