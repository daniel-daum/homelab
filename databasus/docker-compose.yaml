services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.72.0@sha256:3107a04a0c6601557fa0a52491869a5705b70a67a060216ce127bed003fac214
    ports:
      - "127.0.0.1:4005:4005"
    volumes:
      - databasus-data:/databasus-data
    restart: unless-stopped
    networks:
      - holonet

volumes:
  databasus-data:
    name: databasus-data

networks:
  holonet:
    external: true
