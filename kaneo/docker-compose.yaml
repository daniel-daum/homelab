services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.50.0@sha256:03ad082e33945b9c091266af60c7c88865cb2fab37ff33d91cbbcab626b0094d
    container_name: kaneo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - holonet
    environment:
      - KANEO_CLIENT_URL
      - AUTH_SECRET
      - DATABASE_URL
      - NOTIFICATION_SECRET_ENCRYPTION_KEY
      - TRUSTED_PROXIES
      - DISABLE_GUEST_ACCESS
      - DISABLE_REGISTRATION
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_REGION
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - KANEO_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS

networks:
  holonet:
    external: true
