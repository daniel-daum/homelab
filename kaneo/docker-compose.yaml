services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.46.2@sha256:f44be9aa22546f95c59076bee86678bffcaf5e5d4b960c58a107ad1a05cd1f90
    container_name: kaneo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - holonet
    environment:
      - KANEO_CLIENT_URL
      - AUTH_SECRET
      - DATABASE_URL
      - DISABLE_GUEST_ACCESS
      - DISABLE_REGISTRATION
      - S3_ACCESS_KEY_ID
      - S3_BUCKET
      - S3_ENDPOINT
      - S3_FORCE_PATH_STYLE
      - S3_REGION
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE

networks:
  holonet:
    external: true
