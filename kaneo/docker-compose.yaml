services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.9.0@sha256:11f554b96d826cea29d4f1d06b33cdc97b9cb64e1985eba67f1da3418dd1aaeb
    container_name: kaneo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - holonet
    environment:
      # general
      - KANEO_CLIENT_URL
      - AUTH_SECRET
      - DISABLE_GUEST_ACCESS
      - DISABLE_REGISTRATION
      # database (external, so explicit URL)
      - DATABASE_URL
      # cloudflare r2
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_REGION
      - S3_FORCE_PATH_STYLE
      # pocket id
      - CUSTOM_OAUTH_CLIENT_ID
      - CUSTOM_OAUTH_CLIENT_SECRET
      - CUSTOM_OAUTH_DISCOVERY_URL
      - CUSTOM_OAUTH_AUTHORIZATION_URL
      - CUSTOM_OAUTH_TOKEN_URL
      - CUSTOM_OAUTH_USER_INFO_URL
      - CUSTOM_OAUTH_SCOPES
networks:
  holonet:
    external: true
