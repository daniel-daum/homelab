services:
  infisical:
    image: infisical/infisical:v0.166.9@sha256:d143eb7fc01056e7ca3000f08e2d92dfc79a4fa765fd4d823b481aea45b80c43
    container_name: infisical
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - holonet
    environment:
      - NODE_ENV
      - ENCRYPTION_KEY
      - AUTH_SECRET
      - DB_CONNECTION_URI
      - REDIS_URL
      - SITE_URL
      - TELEMETRY_ENABLED

networks:
  holonet:
    external: true
