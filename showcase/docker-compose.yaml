services:
  showcase:
    image: code.aardvark-halibut.ts.net/daniel/showcase@sha256:e5d3d45006795cbf34f6e43780803f76731a3d1d2b31a8ea7bb333c719399e16
    container_name: showcase
    restart: unless-stopped
    ports:
      - "127.0.0.1:7432:8080"

    volumes:
      - showcase-data:/data
      - ./config.json:/config.json:ro

    # only /data is writable; no capabilities needed
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - holonet

volumes:
  showcase-data:
    name: showcase-data

networks:
  holonet:
    external: true
