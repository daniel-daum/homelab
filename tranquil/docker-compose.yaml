services:
  tranquil:
    image: code.aardvark-halibut.ts.net/daniel/tranquil-pds:v0.7.1@sha256:4f41f8cf2eee6799d1fdc03d38795120f172d9445dbfd898c20a14ef8f284880
    container_name: tranquil
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - tranquil-blobs:/var/lib/tranquil-pds/blobs
    environment:
      - PDS_HOSTNAME
      - SERVER_HOST
      - DATABASE_URL
      - JWT_SECRET
      - DPOP_SECRET
      - MASTER_KEY
      - PLC_ROTATION_KEY
      - INVITE_CODE_REQUIRED
      - TRUSTED_PROXY_COUNT
      - MAX_BLOB_SIZE
      - REPORT_SERVICE_URL
      - REPORT_SERVICE_DID
      - MAIL_FROM_ADDRESS
      - MAIL_FROM_NAME
      - MAIL_SMARTHOST_HOST
      - MAIL_SMARTHOST_PORT
      - MAIL_SMARTHOST_USERNAME
      - MAIL_SMARTHOST_PASSWORD
      - MAIL_SMARTHOST_TLS
    healthcheck:
      test: ["CMD", "/usr/local/bin/tranquil-pds", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - holonet

volumes:
  tranquil-blobs:
    name: tranquil-blobs

networks:
  holonet:
    external: true
