services:
  clustta:
    image: eaxum/clustta:0.4.40@sha256:4ef8be8b340ba3a685ceb70f1e2fff6394c088687f1c3d5404322cc26f0a2473
    container_name: clustta
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7774:7774"
    networks:
      - holonet
    volumes:
      - clustta-data:/var/data/
      - clustta-projects:/var/projects/
      - clustta-storage:/var/storage/
    environment:
      - DATA_DIR
      - PROJECTS_DIR
      - STORAGE_DIR
      - PRIVATE
      - SESSION_DB
      - STUDIO_USERS_DB

volumes:
  clustta-data:
    name: clustta-data
  clustta-projects:
    name: clustta-projects
  clustta-storage:
    name: clustta-storage

networks:
  holonet:
    external: true
