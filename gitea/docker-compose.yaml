services:
  gitea:
    image: gitea/gitea:28.4.0@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
    container_name: gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - gitea-data:/data
      - ./theme/css:/data/gitea/public/assets/css
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    networks:
      - holonet
    environment:
      - USER_UID
      - USER_GID
      # security
      - GITEA__security__INSTALL_LOCK
      # database
      # - GITEA__database__DB_TYPE
      # - GITEA__database__PATH
      - GITEA__database__DB_TYPE
      - GITEA__database__HOST
      - GITEA__database__NAME
      - GITEA__database__USER
      - GITEA__database__PASSWD
      # server
      - GITEA__server__DOMAIN
      - GITEA__server__ROOT_URL
      - GITEA__server__SSH_DOMAIN
      - GITEA__server__SSH_PORT
      - GITEA__server__LANDING_PAGE
      - GITEA__server__LOCAL_ROOT_URL
      # session
      - GITEA__session__SAME_SITE
      # mailer
      - GITEA__mailer__ENABLED
      - GITEA__mailer__SMTP_ADDR
      - GITEA__mailer__SMTP_PORT
      - GITEA__mailer__PROTOCOL
      - GITEA__mailer__USER
      - GITEA__mailer__PASSWD
      - GITEA__mailer__FROM
      # service
      - GITEA__service__DISABLE_REGISTRATION
      - GITEA__service__REQUIRE_SIGNIN_VIEW
      - GITEA__service__OVERLOAD_INFLIGHT_ANONYMOUS_REQUESTS
      # actions
      - GITEA__actions__ENABLED
      # oauth2
      - GITEA__oauth2__ENABLE_AUTO_REGISTRATION
      - GITEA__oauth2__UPDATE_AVATAR
      - GITEA__oauth2__ACCOUNT_LINKING
      # git lfs
      - GITEA__server__LFS_START_SERVER
      - GITEA__lfs__STORAGE_TYPE
      - GITEA__lfs__MINIO_ENDPOINT
      - GITEA__lfs__MINIO_ACCESS_KEY_ID
      - GITEA__lfs__MINIO_SECRET_ACCESS_KEY
      - GITEA__lfs__MINIO_BUCKET
      - GITEA__lfs__MINIO_LOCATION
      - GITEA__lfs__MINIO_USE_SSL
      - GITEA__lfs__SERVE_DIRECT
      # custom theme
      - GITEA__ui__THEMES
      - GITEA__ui__DEFAULT_THEME
      # security and webhooks
      - GITEA__security__EGRESS_MODE
      - GITEA__security__ALLOWED_HOST_LIST
      # commit signing
      - GITEA__repository_0X2E_signing__SIGNING_KEY
      - GITEA__repository_0X2E_signing__SIGNING_FORMAT
      - GITEA__repository_0X2E_signing__SIGNING_NAME
      - GITEA__repository_0X2E_signing__SIGNING_EMAIL
      - GITEA__repository_0X2E_signing__MERGES


  gitea-runner:
    image: gitea/runner:6.0.1@sha256:102bbed0b454b92725845b7abeebd0a6f31d10a91a869fb5207871b0eb7d4778
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      - gitea
    networks:
      - holonet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
      - ./runner-config.yaml:/config.yaml:ro
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: narshaddaa
      CONFIG_FILE: /config.yaml

volumes:
  gitea-data:
    name: gitea-data
    driver: local
  runner-data:
    name: gitea-runner-data-v3

networks:
  holonet:
    external: true
    name: holonet
