services:
  newt:
    image: fosrl/pangolin-cli:0.23.0@sha256:43f786362db1cd4ad60fc46a48c4a62f9bd1f7cc9924902bddd207195f8ba18a
    container_name: newt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - holonet
    environment:
      - PANGOLIN_ENDPOINT
      - SITE_ID
      - SITE_SECRET

networks:
  holonet:
    external: true
